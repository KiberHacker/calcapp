.display{flex:0 0 23%;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:2px 10px 6px;min-height:0}
.expr{font-size:14px;color:var(--ink2);line-height:18px;min-height:18px;max-height:38px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;text-align:right;word-break:break-word;max-width:100%}
#histbtn{left:48px}
#bgbtn{left:84px}
#floatbtn{left:120px}
.float,.float body{background:transparent}
.float .calc{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
.float #bgbtn{display:none}
.hbtn{aspect-ratio:auto;padding:7px 14px;font-size:14px;min-height:0;margin-left:6px}
.hbtn::after{display:none}
.hpanel{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;padding:14px;border-radius:inherit;background:rgba(236,241,255,.62);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6)}
.hpanel.open{display:flex}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.hlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.hitem{aspect-ratio:auto;border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-size:inherit;flex:0 0 auto;min-height:0;width:100%}
.hitem::after{display:none}
.he{font-size:13px;color:var(--ink2);word-break:break-word}
.hr{font-size:24px;font-weight:300}
.hempty{color:var(--ink2);text-align:center;margin:auto;font-size:15px;padding:0 16px}
.res{font-size:44px;font-weight:300;letter-spacing:-1px;line-height:1.05;text-align:right;max-width:100%;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px}
button{appearance:none;border:0;cursor:pointer;min-height:0;border-radius:999px;font:inherit;font-size:22px;font-weight:400;color:var(--ink);position:relative;overflow:hidden;
 background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.12));
 backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);
 box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -2px 6px rgba(140,160,230,.28),inset 0 0 0 1px var(--glass-b),0 8px 20px rgba(80,100,180,.22);
 transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
button::after{content:"";position:absolute;left:14%;right:14%;top:5%;height:42%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,0))}
button:active{transform:scale(.9)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.op{color:#5a3ea8;background:linear-gradient(145deg,rgba(255,226,214,.7),rgba(214,200,255,.4))}
.fn{color:#2f4a9a;font-size:17px}
.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:12%}
.zero::after{left:6%;right:6%}
button.on{box-shadow:inset 0 0 0 3px #fff,0 8px 20px rgba(80,100,180,.3)}
.snd{position:absolute;top:12px;left:12px;width:30px;height:30px;min-height:0;font-size:14px;z-index:2}
.snd::after{display:none}

@media (prefers-reduced-motion:reduce){button{transition:none}}

  <div class="pad" id="pad">
    <button class="fn" data-k="C" aria-label="Tozalash" id="clr">AC</button>
    <button class="fn" data-k="±" aria-label="Ishora">±</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="Bo'lish">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Ko'paytirish">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Ayirish">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Qo'shish">+</button>
    <button class="zero" data-k="0">0</button><button data-k=".">,</button>
    <button class="op" data-k="=" aria-label="Teng">=</button>
  </div>
</main>
<script>
let sndOn=true,ac=null;
function tone(f,t0,d,v){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.02)}
function beep(k){if(!sndOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const t=ac.currentTime;
 if(/\d/.test(k)){const f=[880,988,1047,1175,1319,1397,1568,1760,1976,2093][+k];tone(f,t,.16,.12);tone(f*2,t,.08,.04)}
 else if(k==="="){tone(1047,t,.3,.12);tone(1319,t+.08,.3,.1);tone(1568,t+.16,.45,.09)}
 else if(k==="C"){tone(440,t,.18,.12);tone(330,t+.05,.2,.08)}
 else{tone(660,t,.2,.12);tone(990,t,.1,.04)}
}catch(e){}}

const KEY="lg-calc-hist";
let tokens=[],cur="0",justEval=false,lastExpr="",hist=[];
try{hist=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(hist))hist=[]}catch(e){hist=[]}
function saveHist(){try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}}
const res=document.getElementById("res"),exprEl=document.getElementById("expr"),clr=document.getElementById("clr");
const hpanel=document.getElementById("hpanel"),hlist=document.getElementById("hlist");
const sym={"+":"+","-":"−","*":"×","/":"÷"};
function fmt(s){if(s==="Xato")return s;let [i,d]=s.split(".");const neg=i[0]==="-";if(neg)i=i.slice(1);i=i.replace(/\B(?=(\d{3})+(?!\d))/g," ");return(neg?"-":"")+i+(d!==undefined?",":"")+(d!==undefined?d:"")}
function toText(tk){return tk.map(x=>sym[x]?" "+sym[x]+" ":fmt(x)).join("").trim()}
function evaluate(tk){const nums=[parseFloat(tk[0])],ops=[];
 for(let i=1;i<tk.length;i+=2){const o=tk[i],n=parseFloat(tk[i+1]);
  if(o==="*")nums[nums.length-1]*=n;
  else if(o==="/"){if(n===0)return"Xato";nums[nums.length-1]/=n}
  else{ops.push(o);nums.push(n)}}
 let r=nums[0];ops.forEach((o,i)=>{r=o==="+"?r+nums[i+1]:r-nums[i+1]});
 return isFinite(r)?String(parseFloat(r.toPrecision(12))):"Xato"}
function show(){
 const shown=cur!==""?cur:tokens[tokens.length-2];
 res.textContent=fmt(shown);
 const n=fmt(shown).length;res.style.fontSize=n>8?Math.max(20,44-(n-8)*4)+"px":"";
 let e="";
 if(justEval)e=lastExpr+" =";
 else if(tokens.length)e=toText(cur!==""?tokens.concat(cur):tokens);
 exprEl.textContent=e;
 clr.textContent=(tokens.length||cur!=="0"||justEval)?"C":"AC";
 const last=tokens[tokens.length-1];
 document.querySelectorAll(".op").forEach(b=>b.classList.toggle("on",cur===""&&b.dataset.k===last))}
function doEq(){
 if(!tokens.length)return;
 const tk=tokens.slice();if(cur!=="")tk.push(cur);else tk.pop();
 if(tk.length<3){cur=tk[0];tokens=[];return}
 const r=evaluate(tk);
 lastExpr=toText(tk);
 if(r!=="Xato"){hist.unshift({e:lastExpr,r:r});hist=hist.slice(0,100);saveHist();renderHist()}
 cur=r;tokens=[];justEval=true}
function press(k){beep(k);if(navigator.vibrate)navigator.vibrate(6);
 if(cur==="Xato"&&!/\d|\./.test(k)&&k!=="C"){cur="0";tokens=[];justEval=false}
 if(/\d/.test(k)){if(justEval){tokens=[];cur="0";justEval=false}
  if(cur===""||cur==="0")cur=k;else if(cur.replace(/[-.]/g,"").length<12)cur+=k}
 else if(k==="."){if(justEval){tokens=[];cur="0";justEval=false}if(cur==="")cur="0.";else if(!cur.includes("."))cur+="."}
 else if(k==="B"){if(!justEval&&cur!==""){cur=cur.length>1?cur.slice(0,-1):"0";if(cur==="-")cur="0"}}
 else if(k==="C"){if(tokens.length&&cur!==""&&cur!=="0"&&!justEval)cur="0";else{tokens=[];cur="0";justEval=false;lastExpr=""}}
 else if(k==="±"){if(cur!==""&&cur!=="0"&&cur!=="Xato")cur=cur[0]==="-"?cur.slice(1):"-"+cur}
 else if(k==="%"){if(cur!==""&&cur!=="Xato")cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)))}
 else if(k==="="){doEq()}
 else{if(justEval){tokens=[];justEval=false}
  if(cur!==""){tokens.push(cur);cur=""}else tokens.pop();
  tokens.push(k)}
 show()}
function renderHist(){hlist.textContent="";
 if(!hist.length){const p=document.createElement("p");p.className="hempty";p.textContent="Hozircha hisob yo’q. Natija olish uchun = ni bosing.";hlist.appendChild(p);return}
 hist.forEach(h=>{const b=document.createElement("button");b.className="hitem";
  const a=document.createElement("span");a.className="he";a.textContent=h.e+" =";
  const r=document.createElement("span");r.className="hr";r.textContent=fmt(h.r);
  b.append(a,r);
  b.addEventListener("click",()=>{tokens=[];cur=h.r;justEval=true;lastExpr=h.e;hpanel.classList.remove("open");show()});
  hlist.appendChild(b)})}
document.getElementById("histbtn").addEventListener("click",()=>{renderHist();hpanel.classList.add("open")});
document.getElementById("hclose").addEventListener("click",()=>hpanel.classList.remove("open"));
document.getElementById("hclear").addEventListener("click",()=>{hist=[];saveHist();renderHist()});
document.getElementById("pad").addEventListener("click",e=>{const b=e.target.closest("button");if(b)press(b.dataset.k)});
addEventListener("keydown",e=>{const k=e.key;if(/^\d$/.test(k)||"+-*/".includes(k))press(k);else if(k==="."||k===",")press(".");else if(k==="Enter"||k==="=")press("=");else if(k==="Backspace")press("B");else if(k==="Escape")press("C");else if(k==="%")press("%")});
document.getElementById("snd").addEventListener("click",e=>{sndOn=!sndOn;e.currentTarget.textContent=sndOn?"🔊":"🔇";if(sndOn)beep("5")});
const calcEl=document.querySelector(".calc"),bgIn=document.getElementById("bgfile"),BGK="lg-calc-bg";
function setBg(u){calcEl.style.backgroundImage='url("'+u+'")'}
try{const s=localStorage.getItem(BGK);if(s)setBg(s)}catch(e){}
document.getElementById("bgbtn").addEventListener("click",()=>bgIn.click());
bgIn.addEventListener("change",()=>{const f=bgIn.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const img=new Image();img.onload=()=>{const W=720,H=960,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;g.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  const d=c.toDataURL("image/jpeg",.82);setBg(d);try{localStorage.setItem(BGK,d)}catch(e){}};img.src=fr.result};
 fr.readAsDataURL(f);bgIn.value=""});
const fb=document.getElementById("floatbtn");if(window.Android&&window.Android.startFloat){fb.hidden=false;fb.addEventListener("click",()=>window.Android.startFloat())}
renderHist();show();
</script>
</body>
</html>
